name: Giniko Kanal Tarama

on:
  schedule:
    - cron: '0 3 * * *'   # Her gün 03:00 UTC (06:00 Türkiye)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Repository'yi İndir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları Kur
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Kanalları Tara
        run: python nilo.py

      - name: Kanal Sayısını Kontrol Et
        run: |
          COUNT=$(python -c "import json; print(len(json.load(open('channels5.json', encoding='utf-8'))))")
          echo "Bulunan kanal sayısı: $COUNT"

          if [ "$COUNT" -lt 1 ]; then
            echo "HATA: Kanal listesi boş!"
            exit 1
          fi

      - name: Commit ve Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add channels5.json

          if git diff --cached --quiet; then
            echo "Değişiklik bulunamadı."
          else
            git commit -m "Kanal tarama: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin HEAD
          fi
