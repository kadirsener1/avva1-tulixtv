name: Giniko Kanal Tarama

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bagımlılık Kur
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Kanalları Tara
        run: python nilo.py

      - name: Kanal sayısını kontrol et
        run: |
          python3 -c "
          import json
          try:
              with open('channels5.json', 'r', encoding='utf-8') as f:
                  d = json.load(f)
              count = len(d) if isinstance(d, list) else len(d.get('channels', []))
              print(f'Bulunan kanal: {count}')
              if count < 1:
                  print('Kanal sayısı çok az, hata!')
                  exit(1)
          except Exception as e:
              print(f'JSON okuma hatası: {e}')
              exit(1)
          "

      - name: Commit ve Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add channels5.json
          
          if git diff --cached --quiet; then
            echo "Değişiklik yok, commit atlanıyor."
          else
            git commit -m "Kanal tarama: $(date +'%Y-%m-%d')"
            git push origin HEAD
          fi
